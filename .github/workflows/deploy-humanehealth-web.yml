# Push to main deploys Cloud Run service humanehealth-web.
# Org policy blocks allUsers — never pass --allow-unauthenticated.
# Public access uses invoker IAM disabled (--no-invoker-iam-check).
#
# Same Workload Identity pool as the other Devo repos (atla-o/acashi, atla-o/devo).
name: Deploy humanehealth-web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-humanehealth-web
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: devo-holding
  REGION: us-west1
  SERVICE: humanehealth-web
  WIF_PROVIDER: projects/384302503084/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SA: github-cloud-run-deploy@devo-holding.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --source . \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --no-invoker-iam-check \
            --update-env-vars=GCP_PROJECT=devo-holding,GOOGLE_CLOUD_PROJECT=devo-holding
